services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "0.1-compose"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 3
  client:
    image: curlimages/curl:8.10.1
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "while true; do curl -s -X POST http://api:8000/predict -H 'content-type: application/json' -d '{\"features\":[5.1,3.5,1.4,0.2]}'; echo; sleep 2; done"]
